
<!-- DATA SOURCE TRUST STRIP -->
<section class="trust-strip">
  <div class="inner">
    <div class="trust-label"><span class="en">Powered by open satellite data from</span><span class="ko">공개 위성 데이터 기반</span><span class="ja">オープン衛星データを活用</span></div>
    <div class="trust-logos">
      <!-- NASA -->
      <svg viewBox="0 0 110 30" fill="var(--fg)"><text x="0" y="22" font-family="var(--font-display)" font-weight="800" font-size="20" letter-spacing="3">NASA</text></svg>
      <!-- ESA -->
      <svg viewBox="0 0 80 30" fill="var(--fg)"><text x="0" y="22" font-family="var(--font-display)" font-weight="700" font-size="18" letter-spacing="2">ESA</text></svg>
      <!-- USGS -->
      <svg viewBox="0 0 90 30" fill="var(--fg)"><text x="0" y="22" font-family="var(--font-display)" font-weight="700" font-size="17" letter-spacing="1.5">USGS</text></svg>
      <!-- Copernicus -->
      <svg viewBox="0 0 140 30" fill="var(--fg)"><text x="0" y="22" font-family="var(--font-body)" font-weight="600" font-size="16">Copernicus</text></svg>
      <!-- NOAA -->
      <svg viewBox="0 0 90 30" fill="var(--fg)"><text x="0" y="22" font-family="var(--font-display)" font-weight="700" font-size="17" letter-spacing="1.5">NOAA</text></svg>
    </div>
  </div>
</section>
